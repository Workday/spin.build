#
# File: module-catalog.properties
#
# Provides Quark Spin with the ability to map Java Module System Modules to the associated
# Apache Maven Artifacts containing the said module.  It allows Quark Spin to determine the possible Apache Maven
# Artifacts that are required on a Class or Module Path for compilation, testing and building modules.
#
# Each line (property) in this file consists of a Java Module System Name = Apache Maven G:A:T:C:R coordinate
# where:
#   G = groupId
#   A = artifactId
#   T = (optional) artifact type (module) eg: "jar"  (jar is assumed)
#   C = (optional) classifier
#   R = version range
#
# See: https://www.oracle.com/corporate/features/understanding-java-9-modules.html
# See: http://maven.apache.org/pom.html
#


