#
# File: module-catalog.properties
#
# Provides Spin with the ability to map Java Module System Modules to the associated
# Apache Maven Artifact containing the said module.  It allows Spin to determine the Apache Maven Artifacts
# that are required on a Class or Module Path for compilation, testing and building modules.
#
# Each line (property) in this file consists of a Java Module System Name = Apache Maven GAVC coordinate
#
# See: https://www.oracle.com/corporate/features/understanding-java-9-modules.html
# See: http://maven.apache.org/pom.html
#
